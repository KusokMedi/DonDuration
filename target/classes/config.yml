# DonateDuration | Конфигурация
# Автор: KusokMedi
# Репозиторий: github.com/kusokmedi/donduration
# Совместимость: 1.16.5 - 26.2+

# Плейсхолдер: %donduration% (НЕИЗМЕНЯЕМЫЙ - нельзя менять)
# Используй %donduration% в любом плагине с PlaceholderAPI

# Формат отображения плейсхолдера
# %duration% - числовое значение
# %letter% - буква единицы времени
placeholder: "&7(%duration% %letter%)"

# Обозначения единиц времени
letters:
  seconds: "сек"
  minutes: "мин"
  hours: "час"
  days: "д"
  months: "мес"
  years: "г"

# Символ бесконечности (для постоянных групп)
infinity-symbol: "&7∞"

# Настройки кэширования
cache:
  # Включить кэширование результатов (рекомендуется: true)
  enabled: true
  # Время жизни кэша в секундах (по умолчанию: 60)
  ttl: 60
  # Максимальный размер кэша (по умолчанию: 1000)
  max-size: 1000
  # Интервал очистки истёкших записей в секундах (по умолчанию: 300 = 5 минут)
  cleanup-interval: 300

# Режим отладки (подробное логирование)
debug: false
