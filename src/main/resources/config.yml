# DonateDuration | Конфигурация
# Автор: KusokMedi
# Сайт: github.com/kusokmedi/donduration

# Имя плейсхолдера (по умолчанию: %donateduration%)
placeholder-name: "donateduration"

# Формат отображения плейсхолдера
placeholder: "&7(%duration% %letter%)"

# Обозначения единиц времени (полные названия)
letters:
  seconds: "сек."
  minutes: "мин."
  hours: "час."
  days: "дн."
  months: "мес."
  years: "лет"

# Символ бесконечности
infinity-symbol: "&7∞"

# Настройки кэширования
cache:
  # Включить кэширование результатов (рекомендуется: true)
  enabled: true
  # Время жизни кэша в секундах (по умолчанию: 60)
  ttl: 60
  # Максимальный размер кэша (по умолчанию: 1000)
  max-size: 1000

# Режим отладки (подробное логирование)
debug: false
